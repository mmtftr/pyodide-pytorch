name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_run:
    workflows:
      - Build PyTorch wheel
      - Publish verified release artifact
    types: [completed]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build PyTorch wheel' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build playground
        run: |
          npm ci --prefix site
          npm run build --prefix site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble playground shell
        run: |
          mkdir -p public/runtime
          cp site/index.html site/styles.css site/worker.js site/service-worker.js public/
          cp site/dist/app.js site/dist/app.js.map public/

      - name: Download verified main-build artifact
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build PyTorch wheel'
        uses: actions/download-artifact@v8
        with:
          pattern: torch-*-pyodide-*
          path: public/runtime
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download verified release artifact
        if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Build PyTorch wheel'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            release_args+=("$RELEASE_TAG")
          fi
          gh release download "${release_args[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "build-manifest.json" \
            --pattern "*.whl" \
            --pattern "*.whl.sha256" \
            --dir public/runtime

      - name: Verify playground wheel
        env:
          BUILD_WORKFLOW_COMMIT: ${{ github.event.workflow_run.head_sha }}
          FROM_BUILD_WORKFLOW: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build PyTorch wheel' }}
        run: |
          if [[ "$FROM_BUILD_WORKFLOW" == "true" ]]; then
            builder_commit="$BUILD_WORKFLOW_COMMIT"
          else
            builder_commit="$(
              python3 -c 'import json; print(json.load(open("public/runtime/build-manifest.json"))["builder_repository_commit"])'
            )"
          fi
          python3 scripts/verify_release_artifact.py \
            public/runtime \
            --builder-commit "$builder_commit"

      - name: Upload playground artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
