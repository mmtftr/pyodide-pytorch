name: Build PyTorch wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "patches/**"
      - "vendor/**"
      - "webgpu/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/publish-release.yml"

concurrency:
  group: pytorch-pyodide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out build repository
        uses: actions/checkout@v7

      - name: Publish pending build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_status.sh pytorch-pyodide/build pending

      - name: Read pinned configuration
        id: config
        run: |
          python3 scripts/config.py check
          python3 scripts/config.py github-output >> "$GITHUB_OUTPUT"
          python3 scripts/config.py env >> "$GITHUB_ENV"

      - name: Reserve release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api_error="$(mktemp)"
          if tag_ref="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha' 2>"$api_error"
          )"; then
            if [[ "$tag_ref" != "commit $GITHUB_SHA" ]]; then
              echo "::error::Release $RELEASE_TAG already belongs to $tag_ref. Increment the release revision before rebuilding."
              exit 1
            fi
            echo "Retrying the build already reserved by $RELEASE_TAG at $GITHUB_SHA"
          elif grep -Fq "(HTTP 404)" "$api_error"; then
            echo "Release identity $RELEASE_TAG is available for $GITHUB_SHA"
          else
            cat "$api_error" >&2
            echo "::error::Could not safely determine whether $RELEASE_TAG exists"
            exit 1
          fi

      - name: Check out pinned PyTorch source
        uses: actions/checkout@v7
        with:
          repository: pytorch/pytorch
          ref: ${{ steps.config.outputs.pytorch_ref }}
          path: pytorch
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Apply ordered patches
        run: scripts/apply_patches.sh pytorch

      - name: Set up host Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.config.outputs.python_version }}

      - name: Restore Pyodide cross-build environment
        id: xbuildenv-restore
        uses: actions/cache/restore@v6
        with:
          path: .pyodide-xbuildenv
          key: xbuildenv-v1-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.config.outputs.python_version }}-pyodide-${{ steps.config.outputs.pyodide_version }}-build-${{ steps.config.outputs.pyodide_build_version }}

      - name: Install build tools
        env:
          DEFAULT_CROSS_BUILD_ENV_URL: https://github.com/pyodide/pyodide/releases/download/${{ steps.config.outputs.pyodide_version }}/xbuildenv-${{ steps.config.outputs.pyodide_version }}.tar.bz2
          PYODIDE_XBUILDENV_PATH: ${{ github.workspace }}/.pyodide-xbuildenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r config/build-constraints.txt \
            "pyodide-build==${PYODIDE_BUILD_VERSION}" \
            "auditwheel-emscripten==${AUDITWHEEL_EMSCRIPTEN_VERSION}"
          actual_pyodide_build="$(python -c 'import importlib.metadata; print(importlib.metadata.version("pyodide-build"))')"
          test "$actual_pyodide_build" = "$PYODIDE_BUILD_VERSION"
          actual_auditwheel="$(python -c 'import importlib.metadata; print(importlib.metadata.version("auditwheel-emscripten"))')"
          test "$actual_auditwheel" = "$AUDITWHEEL_EMSCRIPTEN_VERSION"
          test "$(cmake --version | head -1)" = "cmake version $CMAKE_VERSION"
          sudo apt-get update
          sudo apt-get install --yes ccache
          actual_emscripten="$(pyodide config get emscripten_version)"
          test "$actual_emscripten" = "$EMSCRIPTEN_VERSION"

      - name: Save Pyodide cross-build environment
        if: steps.xbuildenv-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .pyodide-xbuildenv
          key: xbuildenv-v1-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.config.outputs.python_version }}-pyodide-${{ steps.config.outputs.pyodide_version }}-build-${{ steps.config.outputs.pyodide_build_version }}

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-v3-${{ runner.os }}-${{ runner.arch }}-emcc-${{ steps.config.outputs.emscripten_version }}-${{ steps.config.outputs.python_tag }}-pyodide-build-${{ steps.config.outputs.pyodide_build_version }}-torch-${{ steps.config.outputs.pytorch_ref }}-${{ hashFiles('config/build.toml', 'config/build-constraints.txt', 'patches/pytorch/*.patch', 'scripts/build_wheel.sh', 'scripts/cmake/**', 'scripts/stage_webgpu_sources.py', 'vendor/**', 'webgpu/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v3-${{ runner.os }}-${{ runner.arch }}-emcc-${{ steps.config.outputs.emscripten_version }}-${{ steps.config.outputs.python_tag }}-pyodide-build-${{ steps.config.outputs.pyodide_build_version }}-torch-${{ steps.config.outputs.pytorch_ref }}-${{ hashFiles('config/build.toml', 'config/build-constraints.txt', 'patches/pytorch/*.patch', 'scripts/build_wheel.sh', 'scripts/cmake/**', 'scripts/stage_webgpu_sources.py', 'vendor/**', 'webgpu/**') }}-
            ccache-v3-${{ runner.os }}-${{ runner.arch }}-emcc-${{ steps.config.outputs.emscripten_version }}-${{ steps.config.outputs.python_tag }}-pyodide-build-${{ steps.config.outputs.pyodide_build_version }}-torch-${{ steps.config.outputs.pytorch_ref }}-
            ccache-v3-${{ runner.os }}-${{ runner.arch }}-emcc-${{ steps.config.outputs.emscripten_version }}-${{ steps.config.outputs.python_tag }}-pyodide-build-${{ steps.config.outputs.pyodide_build_version }}-

      - name: Report compiler cache restore
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MATCHED_KEY: ${{ steps.ccache-restore.outputs.cache-matched-key }}
        run: |
          if [[ -n "$CCACHE_MATCHED_KEY" ]]; then
            echo "Restored compiler cache: $CCACHE_MATCHED_KEY"
          else
            echo "No compiler cache matched; this run will seed one"
          fi
          ccache --show-stats

      - name: Restore native protoc cache
        id: protoc-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pytorch-host-protobuf
          key: host-protoc-ubuntu-24.04-${{ runner.arch }}-cmake-${{ steps.config.outputs.cmake_version }}-torch-${{ steps.config.outputs.pytorch_ref }}-${{ hashFiles('scripts/build_host_protoc.sh') }}

      - name: Build native protoc from the pinned submodule
        if: steps.protoc-restore.outputs.cache-hit != 'true'
        run: scripts/build_host_protoc.sh pytorch "$RUNNER_TEMP/pytorch-host-protobuf"

      - name: Verify native protoc
        run: test -x "$RUNNER_TEMP/pytorch-host-protobuf/bin/protoc"

      - name: Save native protoc cache
        if: steps.protoc-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/pytorch-host-protobuf
          key: host-protoc-ubuntu-24.04-${{ runner.arch }}-cmake-${{ steps.config.outputs.cmake_version }}-torch-${{ steps.config.outputs.pytorch_ref }}-${{ hashFiles('scripts/build_host_protoc.sh') }}

      - name: Set up pinned Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.config.outputs.emscripten_version }}
          actions-cache-folder: emsdk-cache

      - name: Normalize pinned Emscripten path for ccache
        run: |
          stable_emsdk="$GITHUB_WORKSPACE/emsdk-cache/emsdk-main"
          test -x "$stable_emsdk/emsdk"
          "$stable_emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
          source "$stable_emsdk/emsdk_env.sh" >/dev/null
          {
            echo "EMSDK=$EMSDK"
            echo "EMSDK_NODE=$EMSDK_NODE"
          } >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          test "$(command -v emcc)" = "$EMSDK/upstream/emscripten/emcc"

      - name: Verify Emscripten CMake link features
        run: |
          stable_emscripten_root="$GITHUB_WORKSPACE/emsdk-cache/emsdk-main/upstream/emscripten"
          test "$(em-config EMSCRIPTEN_ROOT)" = "$stable_emscripten_root"
          toolchain="$(em-config EMSCRIPTEN_ROOT)/cmake/Modules/Platform/Emscripten.cmake"
          grep -Fq \
            'set(CMAKE_LINK_LIBRARY_USING_WHOLE_ARCHIVE_SUPPORTED True)' \
            "$toolchain"

      - name: Restore pinned LAPACK package
        id: lapack-restore
        uses: actions/cache/restore@v6
        with:
          path: .pyodide-package-cache
          key: pyodide-package-v1-${{ steps.config.outputs.pyodide_version }}-${{ steps.config.outputs.lapack_archive }}-${{ steps.config.outputs.lapack_sha256 }}

      - name: Fetch pinned LAPACK library
        run: |
          python scripts/fetch_lapack.py \
            --cache-dir .pyodide-package-cache \
            --output-dir .pyodide-lapack
          test -f ".pyodide-lapack/lib/$LAPACK_LIBRARY"

      - name: Save pinned LAPACK package
        if: steps.lapack-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .pyodide-package-cache
          key: pyodide-package-v1-${{ steps.config.outputs.pyodide_version }}-${{ steps.config.outputs.lapack_archive }}-${{ steps.config.outputs.lapack_sha256 }}

      - name: Build raw WebAssembly wheel
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}/pytorch
          CCACHE_COMPILERCHECK: content
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_NOHASHDIR: "true"
          CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
          DEFAULT_CROSS_BUILD_ENV_URL: https://github.com/pyodide/pyodide/releases/download/${{ steps.config.outputs.pyodide_version }}/xbuildenv-${{ steps.config.outputs.pyodide_version }}.tar.bz2
          PYODIDE_XBUILDENV_PATH: ${{ github.workspace }}/.pyodide-xbuildenv
          PYODIDE_LAPACK_LIBRARY: ${{ github.workspace }}/.pyodide-lapack/lib/${{ steps.config.outputs.lapack_library }}
          PYTORCH_HOST_PROTOC: ${{ runner.temp }}/pytorch-host-protobuf/bin/protoc
        run: |
          ccache --show-config
          ccache --zero-stats
          SOURCE_DATE_EPOCH="$(git -C pytorch show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          scripts/build_wheel.sh pytorch wheelhouse/raw
          ccache --show-stats --verbose

      - name: Prepare compiler cache for rolling save
        if: ${{ always() && !cancelled() && steps.ccache-restore.outcome == 'success' }}
        continue-on-error: true
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: |
          ccache --cleanup
          ccache --show-stats --verbose

      - name: Save compiler cache
        if: ${{ always() && !cancelled() && steps.ccache-restore.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-v3-${{ runner.os }}-${{ runner.arch }}-emcc-${{ steps.config.outputs.emscripten_version }}-${{ steps.config.outputs.python_tag }}-pyodide-build-${{ steps.config.outputs.pyodide_build_version }}-torch-${{ steps.config.outputs.pytorch_ref }}-${{ hashFiles('config/build.toml', 'config/build-constraints.txt', 'patches/pytorch/*.patch', 'scripts/build_wheel.sh', 'scripts/cmake/**', 'scripts/stage_webgpu_sources.py', 'vendor/**', 'webgpu/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune, vendor LAPACK, and validate wheel
        id: wheel
        run: |
          mapfile -t raw_wheels < <(find wheelhouse/raw -maxdepth 1 -type f -name '*.whl' -print)
          test "${#raw_wheels[@]}" -eq 1
          python scripts/postprocess_wheel.py \
            "${raw_wheels[0]}" \
            --output-dir wheelhouse/pruned \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          mapfile -t pruned_wheels < <(find wheelhouse/pruned -maxdepth 1 -type f -name '*.whl' -print)
          test "${#pruned_wheels[@]}" -eq 1
          pyodide auditwheel show "${pruned_wheels[0]}"
          mkdir -p wheelhouse/repaired
          pyodide auditwheel repair \
            "${pruned_wheels[0]}" \
            --libdir .pyodide-lapack/lib \
            --output-dir wheelhouse/repaired
          mapfile -t repaired_wheels < <(find wheelhouse/repaired -maxdepth 1 -type f -name '*.whl' -print)
          test "${#repaired_wheels[@]}" -eq 1
          python scripts/postprocess_wheel.py \
            "${repaired_wheels[0]}" \
            --output-dir wheelhouse/dist \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          mapfile -t wheels < <(find wheelhouse/dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          python scripts/validate_wheel.py "${wheels[0]}"
          wheel_dir="$(dirname "${wheels[0]}")"
          wheel_name="$(basename "${wheels[0]}")"
          (
            cd "$wheel_dir"
            sha256sum "$wheel_name" > "$wheel_name.sha256"
          )
          python scripts/release_manifest.py \
            "${wheels[0]}" \
            --output wheelhouse/dist/build-manifest.json
          echo "path=${wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${wheels[0]}")" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Prepare pinned Transformers browser dependencies
        run: |
          python scripts/prepare_transformers_browser_deps.py \
            --output-dir wheelhouse/transformers-browser

      - name: Test inside pinned Pyodide
        run: |
          mapfile -t filelock_wheels < <(
            find wheelhouse/transformers-browser \
              -maxdepth 1 \
              -type f \
              -name 'filelock-*.whl' \
              -print
          )
          test "${#filelock_wheels[@]}" -eq 1
          npm install --no-save \
            "puppeteer-core@25.4.0" \
            "pyodide@$PYODIDE_VERSION"
          # Compile and execute the project-owned reduction shader directly so
          # WGSL/numerical regressions fail before loading the large wheel.
          node tests/webgpu-layer-norm-wgsl.mjs
          # Validate the byte-packed Bool comparison/reduction/fill contract,
          # including every shader that reads or writes Bool storage.
          node tests/webgpu-bool-wgsl.mjs
          # Compile and execute the shared float32 scalar-binary shader across
          # every registered operation and exact-output aliasing profile.
          node tests/webgpu-scalar-binary-wgsl.mjs
          # Compile and execute both the portable and, when available, fixed-32
          # subgroup decode-time fused SwiGLU shaders.
          node tests/webgpu-swiglu-wgsl.mjs
          # Validate fused paired K/V indexed writes, restricted-Long positions,
          # and containment of invalid indices before loading the wheel.
          node tests/webgpu-kv-cache-wgsl.mjs
          # Validate the fixed-SIMD32 Q8 group-128 format, dequantization,
          # storage reduction, and fail-closed device/shape boundaries.
          node tests/webgpu-packed-gemv-wgsl.mjs
          # Compile and execute the exact Gemma2 mask-construction and
          # offset-weight normalization shaders before loading the wheel.
          node tests/webgpu-gemma2-wgsl.mjs
          # Validate broadcast float32 masked_fill against packed Bool masks,
          # including strided offsets, rank-eight metadata, infinities, and tails.
          node tests/webgpu-masked-fill-wgsl.mjs
          # Validate canonical restricted-Long cumsum and isin generation
          # plumbing, including inverted membership and strided inputs.
          node tests/webgpu-generation-long-wgsl.mjs
          node tests/smoke.mjs \
            "${{ steps.wheel.outputs.path }}" \
            "$PYTORCH_VERSION" \
            "$PYTORCH_REF" \
            "${filelock_wheels[0]}"
          node tests/upstream.mjs \
            "${{ steps.wheel.outputs.path }}" \
            pytorch \
            "$PYTORCH_VERSION" \
            "$PYTORCH_REF"
          # The Node smoke test above downloads the pinned Pyodide packages
          # into this cache. Unlike an xbuildenv dist directory, it is therefore
          # a complete, browser-servable runtime rather than core files only.
          pyodide_dist="$GITHUB_WORKSPACE/node_modules/pyodide"
          node tests/webgpu.mjs \
            "${{ steps.wheel.outputs.path }}" \
            "${filelock_wheels[0]}" \
            "$pyodide_dist"
          node tests/webgpu.mjs \
            "${{ steps.wheel.outputs.path }}" \
            "${filelock_wheels[0]}" \
            "$pyodide_dist" \
            tests/webgpu-jspi.html
          node tests/webgpu.mjs \
            "${{ steps.wheel.outputs.path }}" \
            "${filelock_wheels[0]}" \
            "$pyodide_dist" \
            tests/webgpu-linear-benchmark.html

      - name: Test hermetic Transformers WebGPU matrix
        run: |
          mapfile -t filelock_wheels < <(
            find wheelhouse/transformers-browser \
              -maxdepth 1 \
              -type f \
              -name 'filelock-*.whl' \
              -print
          )
          mapfile -t transformers_wheels < <(
            find wheelhouse/transformers-browser \
              -maxdepth 1 \
              -type f \
              -name 'transformers-*.whl' \
              -print
          )
          mapfile -t hub_wheels < <(
            find wheelhouse/transformers-browser \
              -maxdepth 1 \
              -type f \
              -name 'huggingface_hub-*.whl' \
              -print
          )
          test "${#filelock_wheels[@]}" -eq 1
          test "${#transformers_wheels[@]}" -eq 1
          test "${#hub_wheels[@]}" -eq 1
          node tests/transformers-webgpu.mjs \
            "${{ steps.wheel.outputs.path }}" \
            "${filelock_wheels[0]}" \
            "${transformers_wheels[0]}" \
            "${hub_wheels[0]}" \
            "$GITHUB_WORKSPACE/node_modules/pyodide"
          node tests/transformers-webgpu.mjs \
            "${{ steps.wheel.outputs.path }}" \
            "${filelock_wheels[0]}" \
            "${transformers_wheels[0]}" \
            "${hub_wheels[0]}" \
            "$GITHUB_WORKSPACE/node_modules/pyodide" \
            tests/transformers-gemma2-webgpu.html

      - name: Upload unverified wheel after validation or smoke failure
        if: ${{ failure() && steps.wheel.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: unverified-torch-${{ steps.config.outputs.pytorch_version }}-pyodide-${{ steps.config.outputs.pyodide_version }}
          path: |
            wheelhouse/raw/*
            wheelhouse/pruned/*
            wheelhouse/repaired/*
            wheelhouse/dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload wheel and provenance
        uses: actions/upload-artifact@v7
        with:
          name: torch-${{ steps.config.outputs.pytorch_version }}-pyodide-${{ steps.config.outputs.pyodide_version }}
          path: wheelhouse/dist/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Attest wheel provenance
        # GitHub does not provide artifact attestations for user-owned private
        # repositories. Release publication must not discard an otherwise
        # verified wheel; attestations become mandatory once the repo is public.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            wheelhouse/dist/*.whl
            wheelhouse/dist/*.sha256
            wheelhouse/dist/build-manifest.json

      - name: Upload CMake diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cmake-diagnostics-${{ github.run_id }}
          path: |
            pytorch/build/CMakeCache.txt
            pytorch/build/CMakeFiles/CMakeError.log
            pytorch/build/CMakeFiles/CMakeOutput.log
            pytorch/build/build.ninja
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_status.sh pytorch-pyodide/build "${{ job.status }}"
