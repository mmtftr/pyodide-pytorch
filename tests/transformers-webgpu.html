    ok: false,
    message: "starting",
    validationErrors: [],

    const transformersWheel = parameters.get("transformers");

      throw new Error("wheel query parameters are missing");

      powerPreference: "high-performance",
    });
    if (adapter === null || adapter === undefined) {
      throw new Error("WebGPU adapter unavailable");

    const fixed32Subgroups =
      adapter.features.has("subgroups") &&
      adapterInfo.subgroupMinSize === 32 &&
      adapterInfo.subgroupMaxSize === 32;

    config=cache_config,

    device="webgpu",
    dtype=torch.float32,
)
cache_keys_cpu = torch.linspace(-1.0, 1.0, 16).reshape(1, 2, 2, 4)
cache_values_cpu = cache_keys_cpu * -3.0 + 0.25
cache_tail_keys_cpu = torch.full((1, 2, 1, 4), 7.0)
cache_tail_values_cpu = torch.full((1, 2, 1, 4), -11.0)
cache_before = torch.webgpu.diagnostics()
with torch.no_grad(), torch.webgpu.batch():
    cache.update(
        cache_keys_cpu.to("webgpu"),
        cache_values_cpu.to("webgpu"),

        {

                [0, 1], dtype=torch.long, device="webgpu"

    cache_keys_gpu, cache_values_gpu = cache.update(

# Exercise the Python conversion helper end to end. Hardware with fixed SIMD32
# must run the packed operator; other adapters must fail closed after conversion.
from transformers_q8 import (
    WebGPUQ8Linear,
    convert_linear_modules_q8_,
    pack_q8_weight,
)

torch.manual_seed(fixture["seed"] + 900)
q8_linear_cpu = torch.nn.Linear(128, 132, bias=True).eval()
q8_input_cpu = torch.linspace(-0.75, 0.75, 128).reshape(1, 1, 128)
q8_packed_cpu, q8_scales_cpu = pack_q8_weight(
    q8_linear_cpu.weight.detach()
)
q8_bytes_cpu = torch.stack(
    tuple((q8_packed_cpu >> shift) & 0xFF for shift in (0, 8, 16, 24)),
    dim=-1,
).reshape(132, 128)
q8_signed_cpu = torch.where(
    q8_bytes_cpu >= 128,
    q8_bytes_cpu - 256,
    q8_bytes_cpu,
).to(torch.float32)
q8_dequantized_cpu = (
    q8_signed_cpu.reshape(132, 1, 128)
    * q8_scales_cpu.unsqueeze(-1)
    / 127.0
).reshape(132, 128)
q8_expected = F.linear(
    q8_input_cpu,
    q8_dequantized_cpu,
    q8_linear_cpu.bias.detach(),
)
q8_container = torch.nn.Sequential(q8_linear_cpu).eval()
q8_records = convert_linear_modules_q8_(q8_container)
assert len(q8_records) == 1
assert isinstance(q8_container[0], WebGPUQ8Linear)
assert not hasattr(q8_container[0], "weight")
assert q8_records[0].packed_weight_bytes * 3 < q8_records[0].float_weight_bytes
q8_supported = bool(js.webgpuTestFixed32Subgroups)

    "fixed_simd32": q8_supported,
    "converted_modules": len(q8_records),
    "float_weight_bytes": q8_records[0].float_weight_bytes,
    "packed_weight_bytes": q8_records[0].packed_weight_bytes,
}
if q8_supported:
    q8_before = torch.webgpu.diagnostics()
    with torch.no_grad(), torch.webgpu.batch():
        q8_actual_gpu = q8_container(q8_input_cpu.to("webgpu"))
    q8_actual = q8_actual_gpu.cpu()
    q8_after = torch.webgpu.diagnostics()
    torch.testing.assert_close(q8_actual, q8_expected, rtol=2e-5, atol=2e-6)
    q8_probe["dispatches"] = int(

    q8_probe["readbacks"] = int(

    assert q8_probe["readbacks"] == 1

class OpRecorder(TorchDispatchMode):
    def __init__(self):
        self.ops = set()
        self.counts = {}

    def __torch_dispatch__(self, func, types, args=(), kwargs=None):
        schema = func._schema
        name = schema.name
        if schema.overload_name:
            name += "." + schema.overload_name
        self.ops.add(name)
        self.counts[name] = self.counts.get(name, 0) + 1
        return func(*args, **(kwargs or {}))


def has_webgpu_kernel(name):
    for query in (
        "_dispatch_has_computed_kernel_for_dispatch_key",
        "_dispatch_has_kernel_for_dispatch_key",
    ):
        checker = getattr(torch._C, query, None)
        if checker is None:
            continue
        try:
            return bool(checker(name, "PrivateUse1"))
        except RuntimeError:
            continue
    return None

        }
    values = {

rms_norm_probes = []
for module_name, class_name in (
    ("transformers.models.qwen2.modeling_qwen2", "Qwen2RMSNorm"),
    ("transformers.models.llama.modeling_llama", "LlamaRMSNorm"),
    ("transformers.models.mistral.modeling_mistral", "MistralRMSNorm"),
    ("transformers.models.phi3.modeling_phi3", "Phi3RMSNorm"),
):
    norm_class = getattr(importlib.import_module(module_name), class_name)
    upstream_forward = getattr(norm_class.forward, "__wrapped__", None)
    assert upstream_forward is not None, class_name
    norm = norm_class(16).eval()
    norm_input_cpu = torch.linspace(-2.0, 2.0, 2 * 3 * 16).reshape(2, 3, 16)
    cpu_recorder = OpRecorder()
    with torch.no_grad(), cpu_recorder:
        norm_expected = norm(norm_input_cpu)
    expected_cpu_counts = {
        "aten::add.Tensor": 1,
        "aten::mean.dim": 1,
        "aten::mul.Tensor": 2,
        "aten::pow.Tensor_Scalar": 1,
        "aten::rsqrt": 1,
    }
    assert cpu_recorder.counts == expected_cpu_counts, (
        class_name,
        cpu_recorder.counts,
    )
    assert "aten::rms_norm" not in cpu_recorder.ops
    upstream_operator_count = sum(cpu_recorder.counts.values())
    assert upstream_operator_count == 6, (class_name, upstream_operator_count)

    norm.to("webgpu")
    norm_input_gpu = norm_input_cpu.to("webgpu")
    batch = getattr(torch.webgpu, "batch", contextlib.nullcontext)

    fused_before = torch.webgpu.diagnostics()
    fused_recorder = OpRecorder()
    with torch.no_grad(), batch(), fused_recorder:
        fused_output = norm(norm_input_gpu)
    fused_actual = fused_output.cpu()
    fused_after = torch.webgpu.diagnostics()

    fused_dispatches = int(
        fused_after["dispatches"] - fused_before["dispatches"]
    )
    fused_readbacks = int(
        fused_after["readbacks"] - fused_before["readbacks"]
    )
    fused_cpu_fallbacks = int(
        fused_after["cpu_fallbacks"] - fused_before["cpu_fallbacks"]
    )
    logical_dispatches_saved = upstream_operator_count - fused_dispatches
    assert fused_recorder.counts == {"aten::rms_norm": 1}, (
        class_name,
        fused_recorder.counts,
    )
    assert fused_dispatches == 1, (class_name, fused_dispatches)
    assert fused_readbacks == 1, (class_name, fused_readbacks)
    assert fused_cpu_fallbacks == 0, (class_name, fused_cpu_fallbacks)
    assert logical_dispatches_saved == 5, (
        class_name,
        logical_dispatches_saved,
    )
    torch.testing.assert_close(fused_actual, norm_expected, rtol=4e-5, atol=4e-6)
    rms_norm_probes.append({
        "class": class_name,
        "unmodified_cpu_path": dict(sorted(cpu_recorder.counts.items())),
        "upstream_operator_count": upstream_operator_count,
        "fused_webgpu_path": dict(sorted(fused_recorder.counts.items())),
        "fused_dispatches": fused_dispatches,
        "fused_readbacks": fused_readbacks,
        "fused_cpu_fallbacks": fused_cpu_fallbacks,
        "logical_dispatches_saved": logical_dispatches_saved,
    })
    del norm, norm_input_gpu, fused_output
    gc.collect()

        "Qwen2MLP",
    ),
    (
        "llama",
        "transformers.models.llama.modeling_llama",
        "LlamaMLP",
    ),
    (
        "mistral",
        "transformers.models.mistral.modeling_mistral",
        "MistralMLP",
    ),
)):
    spec = next(model for model in fixture["models"] if model["name"] == family_name)
    config = getattr(transformers, spec["config_class"])(**spec["kwargs"])
    mlp_class = getattr(importlib.import_module(module_name), class_name)
    upstream_forward = getattr(mlp_class.forward, "__wrapped__", None)
    assert upstream_forward is not None, class_name
    torch.manual_seed(fixture["seed"] + 100 + index)
    mlp = mlp_class(config).eval()
    mlp_input_cpu = torch.linspace(
        -1.0,
        1.0,
        config.hidden_size,
        dtype=torch.float32,
    ).reshape(1, 1, config.hidden_size)

    cpu_recorder = OpRecorder()
    with torch.no_grad(), cpu_recorder:
        mlp_expected = mlp(mlp_input_cpu)
    upstream_linear_dispatches = (
        cpu_recorder.counts.get("aten::mm", 0)
        + cpu_recorder.counts.get("aten::addmm", 0)
    )
    assert upstream_linear_dispatches == 3, (
        class_name,
        cpu_recorder.counts,
    )
    assert cpu_recorder.counts.get("aten::silu", 0) == 1
    assert cpu_recorder.counts.get("aten::mul.Tensor", 0) == 1
    upstream_dispatches = upstream_linear_dispatches + 2
    assert upstream_dispatches == 5

    mlp.to("webgpu")
    mlp_input_gpu = mlp_input_cpu.to("webgpu")
    before = torch.webgpu.diagnostics()
    gpu_recorder = OpRecorder()
    batch = getattr(torch.webgpu, "batch", contextlib.nullcontext)
    with torch.no_grad(), batch(), gpu_recorder:
        mlp_output_gpu = mlp(mlp_input_gpu)
    mlp_actual = mlp_output_gpu.cpu()
    after = torch.webgpu.diagnostics()

    fused_calls = gpu_recorder.counts.get("webgpu::fused_swiglu", 0)
    remaining_linear_dispatches = (
        gpu_recorder.counts.get("aten::linear", 0)
        + gpu_recorder.counts.get("aten::mm", 0)
        + gpu_recorder.counts.get("aten::addmm", 0)
    )
    dispatches = int(after["dispatches"] - before["dispatches"])
    readbacks = int(after["readbacks"] - before["readbacks"])
    cpu_fallbacks = int(after["cpu_fallbacks"] - before["cpu_fallbacks"])
    assert fused_calls == 1, (class_name, gpu_recorder.counts)
    assert remaining_linear_dispatches == 1, (
        class_name,
        gpu_recorder.counts,
    )
    assert gpu_recorder.counts.get("aten::silu", 0) == 0
    assert gpu_recorder.counts.get("aten::mul.Tensor", 0) == 0
    assert dispatches == 2, (class_name, dispatches, gpu_recorder.counts)
    assert readbacks == 1, (class_name, readbacks)
    assert cpu_fallbacks == 0, (class_name, cpu_fallbacks)
    assert upstream_dispatches - dispatches == 3
    torch.testing.assert_close(
        mlp_actual,
        mlp_expected,
        rtol=8e-4,
        atol=8e-5,
    )
    swiglu_probes.append({
        "class": class_name,
        "unmodified_cpu_path": dict(sorted(cpu_recorder.counts.items())),
        "upstream_dispatches": upstream_dispatches,
        "fused_webgpu_path": dict(sorted(gpu_recorder.counts.items())),
        "fused_dispatches": dispatches,
        "fused_readbacks": readbacks,
        "fused_cpu_fallbacks": cpu_fallbacks,
        "logical_dispatches_saved": upstream_dispatches - dispatches,
    })
    del mlp, mlp_input_gpu, mlp_output_gpu
    gc.collect()

swiglu_validation_error = await js.webgpuTestDevice.popErrorScope()
if swiglu_validation_error:
    raise RuntimeError(

js.webgpuTestDevice.pushErrorScope("validation")


rotary_scaling_probes = []
for family_name, module_name, class_name in (
    (
        "qwen2",
        "transformers.models.qwen2.modeling_qwen2",
        "Qwen2RotaryEmbedding",
    ),
    (
        "llama",
        "transformers.models.llama.modeling_llama",
        "LlamaRotaryEmbedding",
    ),
):
    spec = next(model for model in fixture["models"] if model["name"] == family_name)
    config = getattr(transformers, spec["config_class"])(**spec["kwargs"])
    rotary_class = getattr(importlib.import_module(module_name), class_name)
    rotary = rotary_class(config=config).eval()
    upstream_forward = getattr(rotary_class.forward, "__wrapped__", None)
    assert upstream_forward is not None, class_name
    rotary_input_cpu = torch.linspace(-1.0, 1.0, 1 * 4 * 4 * 4).reshape(
        1, 4, 4, 4
    )
    rotary_positions_cpu = torch.tensor(
        fixture["position_ids"], dtype=torch.long
    )
    cpu_recorder = OpRecorder()
    with torch.no_grad(), cpu_recorder:
        expected_cos, expected_sin = rotary(
            rotary_input_cpu,
            rotary_positions_cpu,
        )
    upstream_scaling_dispatches = cpu_recorder.counts.get(
        "aten::mul.Tensor", 0
    )
    assert upstream_scaling_dispatches == 2, (
        class_name,
        cpu_recorder.counts,
    )
    expected_rotary = torch.cat((expected_cos, expected_sin), dim=-1)

    rotary.to("webgpu")
    rotary_input_gpu = rotary_input_cpu.to("webgpu")
    rotary_positions_gpu = rotary_positions_cpu.to("webgpu")
    before = torch.webgpu.diagnostics()
    gpu_recorder = OpRecorder()
    batch = getattr(torch.webgpu, "batch", contextlib.nullcontext)
    with torch.no_grad(), batch(), gpu_recorder:
        actual_cos, actual_sin = rotary(
            rotary_input_gpu,
            rotary_positions_gpu,
        )
        actual_rotary_gpu = torch.cat((actual_cos, actual_sin), dim=-1)
    actual_rotary = actual_rotary_gpu.cpu()
    after = torch.webgpu.diagnostics()
    # SwiftShader's WGSL sin/cos approximations differ from CPU libm by up
    # to 1.88e-4 on this deterministic probe. This bound remains narrow enough
    # to catch indexing and scaling defects.
    torch.testing.assert_close(
        actual_rotary,
        expected_rotary,
        rtol=3e-4,
        atol=1e-5,
    )
    assert gpu_recorder.counts.get("aten::mul.Tensor", 0) == 0, (
        class_name,
        gpu_recorder.counts,
    )
    assert gpu_recorder.counts.get("aten::mul.Scalar", 0) == 0, (
        class_name,
        gpu_recorder.counts,
    )
    dispatches = int(after["dispatches"] - before["dispatches"])
    readbacks = int(after["readbacks"] - before["readbacks"])
    cpu_fallbacks = int(after["cpu_fallbacks"] - before["cpu_fallbacks"])
    assert dispatches > 0, (class_name, dispatches)
    assert readbacks == 1, (class_name, readbacks)
    assert cpu_fallbacks == 0, (class_name, cpu_fallbacks)
    rotary_scaling_probes.append({
        "class": class_name,
        "unmodified_cpu_scaling_path": {"aten::mul.Tensor": 2},
        "webgpu_scaling_path": {},
        "identity_dispatches_saved": 2,
        "dispatches": dispatches,
        "readbacks": readbacks,
        "cpu_fallbacks": cpu_fallbacks,
        "gpu_op_counts": dict(sorted(gpu_recorder.counts.items())),
    })
    del rotary, rotary_input_gpu, rotary_positions_gpu, actual_rotary_gpu
    gc.collect()

rotary_validation_error = await js.webgpuTestDevice.popErrorScope()
if rotary_validation_error:
    raise RuntimeError(

extended_model_specs = fixture["models"] + [
    spec
    for spec in fixture["architecture_audit_models"]
    if spec["name"] in ("bloom", "t5")
]
model_specs = [] if bool(js.webgpuTestRmsNormOnly) else extended_model_specs
expected_model_names = {
    "qwen2", "llama", "mistral", "gpt2", "bert",
    "phi3", "opt", "bloom", "t5",
}
if model_specs:
    assert {spec["name"] for spec in model_specs} == expected_model_names
results = []
for index, spec in enumerate(model_specs):
    name = spec["name"]
    entry = {"name": name, "ok": False}
    model = None
    try:
        config_class = getattr(transformers, spec["config_class"])
        model_class = getattr(transformers, spec["model_class"])
        config = config_class(**spec["kwargs"])
        config._attn_implementation = spec.get(
            "attention_implementation", "sdpa"
        )

        torch.manual_seed(fixture["seed"] + index)
        model = model_class(config).eval()
        recorder = OpRecorder()
        with torch.no_grad(), recorder:
            cpu_outputs = model(**model_inputs(spec, "cpu"))
        expected = getattr(cpu_outputs, spec["output"]).detach().clone()
        entry["cpu_shape"] = list(expected.shape)
        entry["cpu_ops"] = sorted(recorder.ops)
        entry["cpu_op_counts"] = dict(sorted(recorder.counts.items()))
        entry["cpu_ops_without_webgpu_kernel"] = sorted(
            op for op in recorder.ops if has_webgpu_kernel(op) is False
        )
        if name in ("qwen2", "llama", "mistral", "phi3"):
            assert recorder.counts.get("aten::rms_norm", 0) == 0
            assert recorder.counts.get("aten::pow.Tensor_Scalar", 0) == 3
            assert recorder.counts.get("aten::mean.dim", 0) == 3
            assert recorder.counts.get("aten::rsqrt", 0) == 3
            entry["cpu_rms_norm_path"] = "unmodified_upstream_composition"
        if name in ("gpt2", "bert", "opt"):
            # These three matrix rows are the affine LayerNorm acceptance gate;
            # decoder-only RMSNorm rows do not exercise native_layer_norm.
            assert "aten::native_layer_norm" in recorder.ops
            entry["native_layer_norm_kernel"] = has_webgpu_kernel(
                "aten::native_layer_norm"
            )
            assert entry["native_layer_norm_kernel"] is not False

        model.to("webgpu")
        before = torch.webgpu.diagnostics()
        batch = getattr(torch.webgpu, "batch", contextlib.nullcontext)
        gpu_recorder = OpRecorder()
        with torch.no_grad(), batch(), gpu_recorder:
            gpu_outputs = model(**model_inputs(spec, "webgpu"))
        actual = getattr(gpu_outputs, spec["output"]).cpu()
        torch.testing.assert_close(actual, expected, rtol=2e-3, atol=2e-4)
        after = torch.webgpu.diagnostics()
        entry["dispatches"] = int(after["dispatches"] - before["dispatches"])
        entry["readbacks"] = int(after["readbacks"] - before["readbacks"])
        entry["cpu_fallbacks"] = int(
            after["cpu_fallbacks"] - before["cpu_fallbacks"]
        )
        entry["gpu_ops"] = sorted(gpu_recorder.ops)
        entry["gpu_op_counts"] = dict(sorted(gpu_recorder.counts.items()))
        if name in ("qwen2", "llama", "mistral", "phi3"):
            fused_calls = gpu_recorder.counts.get("aten::rms_norm", 0)
            assert fused_calls == 3, (name, gpu_recorder.counts)
            assert gpu_recorder.counts.get("aten::pow.Tensor_Scalar", 0) == 0
            assert gpu_recorder.counts.get("aten::mean.dim", 0) == 0
            assert gpu_recorder.counts.get("aten::rsqrt", 0) == 0
            entry["fused_rms_norm_calls"] = fused_calls
            entry["rms_norm_logical_dispatches_saved"] = fused_calls * 5
        if name == "gpt2":
            assert gpu_recorder.counts.get("aten::addmm", 0) == 0
            assert gpu_recorder.counts.get("aten::addmm.out", 0) == 0
            assert gpu_recorder.counts.get("aten::linear", 0) > 0
            entry["unsupported_addmm_dispatches_avoided"] = int(
                gpu_recorder.counts.get("aten::linear", 0)
            )
        if name == "bert":
            assert gpu_recorder.counts.get("aten::all", 0) == 0
            assert gpu_recorder.counts.get("aten::eq.Scalar", 0) == 1
            assert gpu_recorder.counts.get("aten::_local_scalar_dense", 0) == 0
            entry["host_mask_truth_readbacks_avoided"] = 1
        if name == "opt":
            assert gpu_recorder.counts.get("aten::add.Scalar", 0) == 0
            assert gpu_recorder.counts.get("aten::sub.Scalar", 0) == 0
            entry["long_scalar_dispatches_avoided"] = 1
            assert gpu_recorder.counts.get("aten::mul.Tensor", 0) >= 1
            entry["host_scalar_lifts_avoided"] = 1
            assert gpu_recorder.counts.get("aten::all", 0) == 0
            assert gpu_recorder.counts.get("aten::eq.Scalar", 0) == 0
            assert gpu_recorder.counts.get("aten::_local_scalar_dense", 0) == 0
            entry["host_mask_truth_readbacks_avoided"] = 1
        assert entry["dispatches"] > 0
        assert entry["readbacks"] == 1
        assert entry["cpu_fallbacks"] == 0
        entry["ok"] = True
    except BaseException as error:
        entry["error_type"] = type(error).__name__
        entry["error"] = str(error)
        entry["traceback"] = traceback.format_exc(limit=12)
    finally:
        row_validation_error = await js.webgpuTestDevice.popErrorScope()
        if row_validation_error:
            entry["validation_error"] = row_validation_error.message
            if "error" not in entry:
                entry["error_type"] = "WebGPUValidationError"
                entry["error"] = row_validation_error.message
            entry["ok"] = False
        js.webgpuTestDevice.pushErrorScope("validation")
        del model
        gc.collect()
    results.append(entry)

`);
    const diagnostics = result.toJs({ dict_converter: Object.fromEntries });
    result.destroy();
    window.webgpuTest.diagnostics = diagnostics;
    const validationError = await device.popErrorScope();
    if (validationError !== null) {
      window.webgpuTest.validationErrors.push(validationError.message);
    }
    const failedModels = diagnostics.models.filter((model) => !model.ok);
    if (window.webgpuTest.validationErrors.length !== 0) {
      throw new Error(window.webgpuTest.validationErrors.join("\n"));
    }
    if (failedModels.length !== 0) {
      throw new Error(
        `Transformers failures: ${failedModels
          .map((model) => `${model.name}: ${model.error}`)
          .join("; ")}`,
      );
    }
    window.webgpuTest = {
      done: true,
      ok: true,
      message: diagnostics.rms_norm_only
        ? "Hermetic Transformers RMSNorm WebGPU probe passed"
        : "Hermetic Transformers WebGPU test passed",
      validationErrors: [],
      diagnostics,
    };
    report(JSON.stringify(window.webgpuTest, null, 2));
  } catch (error) {
    const message =
      error instanceof Error ? `${error.stack ?? error}` : String(error);
    window.webgpuTest.done = true;
    window.webgpuTest.ok = false;
    window.webgpuTest.message = message;
    console.error(message);
