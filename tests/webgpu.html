<!doctype html>
<meta charset="utf-8">
<title>PyTorch WebGPU browser test</title>
<pre id="status">starting</pre>
<script type="module">
  import { loadPyodide } from "/pyodide/pyodide.mjs";

  const status = document.querySelector("#status");
  const report = (message) => {
    status.textContent += `\n${message}`;
    console.log(message);
  };
  window.webgpuTest = {
    done: false,
    ok: false,
    message: "starting",
    validationErrors: [],
  };

  try {
    const parameters = new URLSearchParams(window.location.search);
    const wheel = parameters.get("wheel");
    const filelockWheel = parameters.get("filelock");
    if (!wheel || !filelockWheel) {
      throw new Error("wheel query parameters are missing");
    }
    if (!navigator.gpu) {
      throw new Error("navigator.gpu is unavailable");
    }
    const adapter = await navigator.gpu.requestAdapter({
      powerPreference: "high-performance",
    });
    if (adapter === null) {
      throw new Error("requestAdapter returned null");
    }
    const device = await adapter.requestDevice();
    device.pushErrorScope("validation");
    device.addEventListener("uncapturederror", (event) => {
      const message = event.error?.message ?? String(event.error);
      window.webgpuTest.validationErrors.push(message);
      console.error(`uncaptured WebGPU error: ${message}`);
    });
    window.webgpuTestDevice = device;
    window.webgpuTest.adapter = {
      architecture: adapter.info?.architecture ?? "",
      description: adapter.info?.description ?? "",
      device: adapter.info?.device ?? "",
      vendor: adapter.info?.vendor ?? "",
    };
    report(`adapter: ${JSON.stringify(window.webgpuTest.adapter)}`);

    const pyodide = await loadPyodide({ indexURL: "/pyodide/" });
    await pyodide.loadPackage([
      "numpy",
      "typing-extensions",
      "sympy",
      "networkx",
      "jinja2",
      "fsspec",
    ]);
    await pyodide.loadPackage(`/dependency/${filelockWheel}`);
    await pyodide.loadPackage(`/wheel/${wheel}`);

    const result = await pyodide.runPythonAsync(`
import torch
import torch.webgpu
import js
import gc

assert torch.webgpu.is_available()
await torch.webgpu.init(device=js.webgpuTestDevice)

x = torch.tensor([1.0, 2.0, 3.0], dtype=torch.float32).to("webgpu")
y = torch.tensor([4.0, 5.0, 6.0], dtype=torch.float32).to("webgpu")
added = x + y
multiplied = x * y
broadcast = torch.add(
    torch.tensor([[1.0], [2.0]]).to("webgpu"),
    torch.tensor([[10.0, 20.0, 30.0]]).to("webgpu"),
    alpha=2,
)
view_base = torch.tensor([1.0, 2.0, 3.0, 4.0]).to("webgpu")
sliced = view_base[1:]
strided = view_base[::2]
strided_doubled = strided + strided
transposed = view_base.view(2, 2).transpose(0, 1)
transposed_doubled = transposed + transposed
cloned = added.clone()
relu_result = torch.relu(torch.tensor([-2.0, 0.5, 3.0]).to("webgpu"))
relu_compile_count = torch.webgpu.shader_compilations()
relu_again = torch.relu(torch.tensor([-1.0, 2.0]).to("webgpu"))
assert torch.webgpu.shader_compilations() == relu_compile_count
mm_result = torch.mm(
    torch.tensor([[1.0, 2.0], [3.0, 4.0]]).to("webgpu"),
    torch.tensor([[5.0, 6.0], [7.0, 8.0]]).to("webgpu"),
)
softmax_result = torch.softmax(
    torch.tensor([[1.0, 2.0, 3.0], [-1.0, 0.0, 1.0]]).to("webgpu"),
    dim=-1,
)
added_cpu = await torch.webgpu.to_cpu_async(added)
multiplied_cpu = await torch.webgpu.to_cpu_async(multiplied)
broadcast_cpu = await torch.webgpu.to_cpu_async(broadcast)
sliced_cpu = await torch.webgpu.to_cpu_async(sliced)
strided_doubled_cpu = await torch.webgpu.to_cpu_async(strided_doubled)
transposed_doubled_cpu = await torch.webgpu.to_cpu_async(transposed_doubled)
cloned_cpu = await torch.webgpu.to_cpu_async(cloned)
relu_cpu = await torch.webgpu.to_cpu_async(relu_result)
relu_again_cpu = await torch.webgpu.to_cpu_async(relu_again)
mm_cpu = await torch.webgpu.to_cpu_async(mm_result)
softmax_cpu = await torch.webgpu.to_cpu_async(softmax_result)

assert isinstance(added, torch.Tensor)
assert added.device.type == "webgpu"
assert torch.ops.webgpu.buffer_id(cloned) != torch.ops.webgpu.buffer_id(added)
assert torch.ops.webgpu.buffer_id(sliced) == torch.ops.webgpu.buffer_id(view_base)
assert sliced.storage_offset() == 1
assert strided.stride() == (2,)
assert transposed.stride() == (1, 2)
sliced.copy_(sliced.detach())
try:
    view_base[1:].copy_(view_base[:-1])
except RuntimeError as error:
    assert "different views of the same GPUBuffer" in str(error)
else:
    raise AssertionError("overlapping same-buffer WebGPU copy unexpectedly succeeded")
torch.testing.assert_close(added_cpu, torch.tensor([5.0, 7.0, 9.0]))
torch.testing.assert_close(
    multiplied_cpu,
    torch.tensor([4.0, 10.0, 18.0]),
)
torch.testing.assert_close(
    broadcast_cpu,
    torch.tensor([[21.0, 41.0, 61.0], [22.0, 42.0, 62.0]]),
)
torch.testing.assert_close(sliced_cpu, torch.tensor([2.0, 3.0, 4.0]))
torch.testing.assert_close(strided_doubled_cpu, torch.tensor([2.0, 6.0]))
torch.testing.assert_close(
    transposed_doubled_cpu,
    torch.tensor([[2.0, 6.0], [4.0, 8.0]]),
)
torch.testing.assert_close(cloned_cpu, added_cpu)
torch.testing.assert_close(relu_cpu, torch.tensor([0.0, 0.5, 3.0]))
torch.testing.assert_close(relu_again_cpu, torch.tensor([0.0, 2.0]))
torch.testing.assert_close(
    mm_cpu,
    torch.tensor([[19.0, 22.0], [43.0, 50.0]]),
    rtol=1e-5,
    atol=1e-6,
)
torch.testing.assert_close(
    softmax_cpu,
    torch.softmax(torch.tensor([[1.0, 2.0, 3.0], [-1.0, 0.0, 1.0]]), dim=-1),
    rtol=2e-5,
    atol=2e-6,
)
diagnostics = torch.webgpu.diagnostics()
assert diagnostics["dispatches"] >= 9
assert diagnostics["gpu_copies"] >= 1
assert diagnostics["shader_compilations"] >= 5
assert diagnostics["pipeline_creations"] >= 5
assert diagnostics["command_submissions"] >= diagnostics["dispatches"]
assert diagnostics["readbacks"] >= 11
assert diagnostics["uploads"] >= 10
assert torch.webgpu.cpu_fallbacks() == 0
state = js.globalThis.__torchWebGPU
assert state.objects.get(1).refs == 1
assert state.objects.get(2).refs == 1

releases_before = diagnostics["buffer_releases"]
temporary = torch.empty((32,), device="webgpu")
temporary_id = torch.ops.webgpu.buffer_id(temporary)
assert js.globalThis.__torchWebGPU.buffers.has(temporary_id)
del temporary
gc.collect()
assert not js.globalThis.__torchWebGPU.buffers.has(temporary_id)
assert torch.webgpu.diagnostics()["buffer_releases"] > releases_before

grad_input = x.detach().requires_grad_(True)
try:
    grad_input + y
except RuntimeError as error:
    assert "autograd is not supported" in str(error)
else:
    raise AssertionError("WebGPU autograd unexpectedly built a graph")

try:
    added.cpu()
except RuntimeError as error:
    assert "asynchronous" in str(error)
else:
    raise AssertionError("synchronous WebGPU readback unexpectedly succeeded")

try:
    torch.argmax(x)
except (NotImplementedError, RuntimeError) as error:
    assert "argmax" in str(error)
else:
    raise AssertionError("CPU-fallback argmax unexpectedly ran on WebGPU")

{
    "added": added_cpu.tolist(),
    "multiplied": multiplied_cpu.tolist(),
    "broadcast": broadcast_cpu.tolist(),
    "sliced": sliced_cpu.tolist(),
    "strided_doubled": strided_doubled_cpu.tolist(),
    "transposed_doubled": transposed_doubled_cpu.tolist(),
    "cloned": cloned_cpu.tolist(),
    "relu": relu_cpu.tolist(),
    "mm": mm_cpu.tolist(),
    "softmax": softmax_cpu.tolist(),
    "kernel_submissions": torch.webgpu.kernel_submissions(),
    "copy_submissions": torch.webgpu.copy_submissions(),
    "cpu_fallbacks": torch.webgpu.cpu_fallbacks(),
    "diagnostics": torch.webgpu.diagnostics(),
}
    `);
    await device.queue.onSubmittedWorkDone();
    const scopedValidationError = await device.popErrorScope();
    if (scopedValidationError !== null) {
      throw new Error(`WebGPU validation error: ${scopedValidationError.message}`);
    }
    await new Promise((resolve) => setTimeout(resolve, 0));
    if (window.webgpuTest.validationErrors.length !== 0) {
      throw new Error(
        `WebGPU validation errors: ${window.webgpuTest.validationErrors.join("; ")}`,
      );
    }
    window.webgpuTest.result = result.toJs({
      dict_converter: Object.fromEntries,
    });
    result.destroy();
    window.webgpuTest.ok = true;
    window.webgpuTest.message = "browser WebGPU dispatch test passed";
    report(window.webgpuTest.message);
  } catch (error) {
    window.webgpuTest.message = error?.stack ?? String(error);
    console.error(error);
    report(window.webgpuTest.message);
  } finally {
    window.webgpuTest.done = true;
  }
</script>
