<!doctype html>
<meta charset="utf-8">
<title>PyTorch WebGPU browser test</title>
<pre id="status">starting</pre>
<script type="module">
  import { loadPyodide } from "/pyodide/pyodide.mjs";

  const status = document.querySelector("#status");
  const report = (message) => {
    status.textContent += `\n${message}`;
    console.log(message);
  };
  window.webgpuTest = {
    done: false,
    ok: false,
    message: "starting",
    validationErrors: [],
  };

  try {
    const parameters = new URLSearchParams(window.location.search);
    const wheel = parameters.get("wheel");
    const filelockWheel = parameters.get("filelock");
    if (!wheel || !filelockWheel) {
      throw new Error("wheel query parameters are missing");
    }
    if (!navigator.gpu) {
      throw new Error("navigator.gpu is unavailable");
    }
    const adapter = await navigator.gpu.requestAdapter({
      powerPreference: "high-performance",
    });
    if (adapter === null) {
      throw new Error("requestAdapter returned null");
    }
    const adapterInfo = adapter.info ?? {};
    const fixed32Subgroups =
      adapter.features.has("subgroups") &&
      adapterInfo.subgroupMinSize === 32 &&
      adapterInfo.subgroupMaxSize === 32;
    const requiredFeatures = fixed32Subgroups ? ["subgroups"] : [];
    const device = await adapter.requestDevice({ requiredFeatures });
    device.pushErrorScope("validation");
    device.addEventListener("uncapturederror", (event) => {
      const message = event.error?.message ?? String(event.error);
      window.webgpuTest.validationErrors.push(message);
      console.error(`uncaptured WebGPU error: ${message}`);
    });
    window.webgpuTestDevice = device;
    window.webgpuTest.adapter = {
      architecture: adapterInfo.architecture ?? "",
      description: adapterInfo.description ?? "",
      device: adapterInfo.device ?? "",
      vendor: adapterInfo.vendor ?? "",
      subgroups: device.features.has("subgroups"),
      subgroupMinSize: adapterInfo.subgroupMinSize ?? null,
      subgroupMaxSize: adapterInfo.subgroupMaxSize ?? null,
    };
    report(`adapter: ${JSON.stringify(window.webgpuTest.adapter)}`);

    const pyodide = await loadPyodide({ indexURL: "/pyodide/" });
    await pyodide.loadPackage([
      "numpy",
      "typing-extensions",
      "sympy",
      "networkx",
      "jinja2",
      "fsspec",
    ]);
    await pyodide.loadPackage(`/dependency/${filelockWheel}`);
    await pyodide.loadPackage(`/wheel/${wheel}`);

    const result = await pyodide.runPythonAsync(`
import torch
import torch.webgpu
import torch.nn.functional as F
import js
import gc
import math
import time

assert torch.webgpu.is_available()
torch.webgpu.init(device=js.webgpuTestDevice)

x = torch.tensor([1.0, 2.0, 3.0], dtype=torch.float32).to("webgpu")
y = torch.tensor([4.0, 5.0, 6.0], dtype=torch.float32).to("webgpu")

# PrivateUse1 _to_copy is selected for CPU -> WebGPU .to(...) as well as
# same-device casts. Keep ordinary Float/Int/restricted-Long uploads on the
# backend's checked copy path.
cpu_upload_float_source = torch.tensor([-9.0, 1.25, -2.5, 7.75])[1:]
cpu_upload_int_source = torch.tensor([-7, 0, 11], dtype=torch.int32)
cpu_upload_long_source = torch.tensor(
    [-2147483648, -1, 0, 2147483647], dtype=torch.int64
)
cpu_upload_bool_source = torch.tensor(
    [True, False, True, True, False, False, True], dtype=torch.bool
)
cpu_upload_float = cpu_upload_float_source.to("webgpu")
cpu_upload_int = cpu_upload_int_source.to("webgpu")
cpu_upload_long = cpu_upload_long_source.to("webgpu")
cpu_upload_bool = cpu_upload_bool_source.to("webgpu")
cpu_upload_noncontiguous_source = torch.arange(
    12, dtype=torch.float32
).reshape(3, 4).t()
try:
    cpu_upload_noncontiguous_source.to("webgpu")
except RuntimeError as error:
    assert "contiguous input for preserve_format" in str(error)
else:
    raise AssertionError("noncontiguous preserve-format CPU upload unexpectedly succeeded")
cpu_upload_contiguous = cpu_upload_noncontiguous_source.to(
    "webgpu", memory_format=torch.contiguous_format
)

# Bool keeps ATen's one-byte storage contract. Exercise an odd-sized upload
# and readback, byte-offset readback, fill, strided clone, same-dtype _to_copy,
# aligned direct copy_, Long eq.Scalar, Bool all, and JSPI truth extraction.
bool_slice = cpu_upload_bool[1:6]
bool_strided_view = cpu_upload_bool[1:6:2]
long_strided_view = cpu_upload_long[1::2]
bool_strided_clone = cpu_upload_bool[::2].clone()
bool_same_dtype_copy = cpu_upload_bool.to(
    dtype=torch.bool,
    copy=True,
    memory_format=torch.contiguous_format,
)
bool_filled_true = torch.full((7,), True, dtype=torch.bool, device="webgpu")
bool_filled_false = torch.full((5,), False, dtype=torch.bool, device="webgpu")
bool_direct_source = torch.tensor(
    [True, False, True, False, False, True, False, True], dtype=torch.bool
).to("webgpu")
bool_direct_copy = torch.empty_like(bool_direct_source)
bool_direct_copy.copy_(bool_direct_source)
comparison_input_cpu = torch.tensor(
    [[1, 1, 1, 1], [1, 1, 1, 1]], dtype=torch.long
)
comparison_true = comparison_input_cpu.to("webgpu") == 1
comparison_false = comparison_input_cpu.to("webgpu") == 0
comparison_all_true = torch.all(comparison_true)
comparison_all_false = torch.all(comparison_false)
empty_bool_all = torch.all(
    torch.empty((0,), dtype=torch.bool, device="webgpu")
)
assert bool(comparison_all_true)
assert not bool(comparison_all_false)
assert bool(empty_bool_all)

added = x + y
multiplied = x * y
broadcast = torch.add(
    torch.tensor([[1.0], [2.0]]).to("webgpu"),
    torch.tensor([[10.0, 20.0, 30.0]]).to("webgpu"),
    alpha=2,
)

# Scalar arithmetic stays on the GPU: it must not synthesize a CPU scalar
# tensor and accidentally enter the Tensor overload. Cover all four real
# float32 overloads, alpha, strided input/output, and the alias-safe temporary
# path used by scalar in-place and tensor in-place operations.
scalar_backing_cpu = torch.linspace(-3.0, 3.0, 24).reshape(3, 8)
scalar_input_cpu = scalar_backing_cpu[1:, 1:7:2]
scalar_input = scalar_backing_cpu.to("webgpu")[1:, 1:7:2]
scalar_add = torch.ops.aten.add.Scalar(scalar_input, 1e-6, alpha=1)
scalar_sub = torch.ops.aten.sub.Scalar(scalar_input, 0.75, alpha=2)
scalar_mul = torch.ops.aten.mul.Scalar(scalar_input, -3.0)
scalar_div = torch.ops.aten.div.Scalar(scalar_input, 2.5)
scalar_out = torch.empty((3, 2), device="webgpu").t()
torch.ops.aten.add.Scalar_out(
    scalar_input, 4.0, alpha=-0.25, out=scalar_out
)

scalar_inplace_backing = scalar_backing_cpu.to("webgpu")
scalar_inplace = scalar_inplace_backing[1:, 1:7:2]
torch.ops.aten.add_.Scalar(scalar_inplace, 2.0, alpha=0.5)
torch.ops.aten.sub_.Scalar(scalar_inplace, 0.25, alpha=2)
torch.ops.aten.mul_.Scalar(scalar_inplace, -4.0)
torch.ops.aten.div_.Scalar(scalar_inplace, 2.0)

tensor_inplace_rhs_cpu = torch.linspace(0.5, 1.0, 6).reshape(2, 3)
tensor_inplace_backing = scalar_backing_cpu.to("webgpu")
tensor_inplace = tensor_inplace_backing[1:, 1:7:2]
tensor_inplace.mul_(tensor_inplace_rhs_cpu.to("webgpu"))
view_base = torch.tensor([1.0, 2.0, 3.0, 4.0]).to("webgpu")
sliced = view_base[1:]
strided = view_base[::2]
strided_doubled = strided + strided
transposed = view_base.view(2, 2).transpose(0, 1)
transposed_doubled = transposed + transposed
# A preallocated-cache prefix has holes between heads because its storage
# retains the capacity-sized sequence stride. Read it back directly so the
# public API, rather than the acceptance test, owns GPU materialization.
readback_prefix_storage_cpu = torch.arange(
    40, dtype=torch.float32
).reshape(1, 2, 5, 4)
readback_prefix_storage = readback_prefix_storage_cpu.to("webgpu")
readback_prefix = readback_prefix_storage.narrow(2, 0, 3)
cloned = added.clone()
copied = torch.empty_like(x)
copied.copy_(x)
relu_result = torch.relu(torch.tensor([-2.0, 0.5, 3.0]).to("webgpu"))
relu_compile_count = torch.webgpu.shader_compilations()
relu_again = torch.relu(torch.tensor([-1.0, 2.0]).to("webgpu"))
assert torch.webgpu.shader_compilations() == relu_compile_count
silu_input_cpu = torch.tensor([-2.0, -0.25, 0.5, 3.0])
silu_result = F.silu(silu_input_cpu.to("webgpu"))
mm_result = torch.mm(
    torch.tensor([[1.0, 2.0], [3.0, 4.0]]).to("webgpu"),
    torch.tensor([[5.0, 6.0], [7.0, 8.0]]).to("webgpu"),
)
softmax_result = torch.softmax(
    torch.tensor([[1.0, 2.0, 3.0], [-1.0, 0.0, 1.0]]).to("webgpu"),
    dim=-1,
)

linear_input_cpu = torch.linspace(-1.0, 1.0, 24).reshape(2, 3, 4)
linear_weight_storage_cpu = torch.linspace(-0.7, 0.8, 20).reshape(4, 5)
linear_weight_cpu = linear_weight_storage_cpu.t()
linear_bias_cpu = torch.linspace(-0.2, 0.2, 5)
linear_weight = linear_weight_storage_cpu.to("webgpu").t()
linear_result = F.linear(
    linear_input_cpu.to("webgpu"),
    linear_weight,
    linear_bias_cpu.to("webgpu"),
)
linear_compile_count = torch.webgpu.shader_compilations()
linear_no_bias_input_cpu = torch.tensor([-0.5, 0.25, 1.0, -1.5])
linear_no_bias_result = F.linear(
    linear_no_bias_input_cpu.to("webgpu"),
    linear_weight,
)
assert torch.webgpu.shader_compilations() == linear_compile_count
linear_rank1_bias_result = F.linear(
    linear_no_bias_input_cpu.to("webgpu"),
    linear_weight,
    linear_bias_cpu.to("webgpu"),
)

linear_view_backing_cpu = torch.linspace(-0.9, 0.9, 48).reshape(4, 3, 4)
linear_view_cpu = linear_view_backing_cpu[1:3].transpose(0, 1)
linear_bias_backing_cpu = torch.linspace(-0.3, 0.3, 7)
linear_bias_view_cpu = linear_bias_backing_cpu[1:6]
linear_view = linear_view_backing_cpu.to("webgpu")[1:3].transpose(0, 1)
linear_bias_view = linear_bias_backing_cpu.to("webgpu")[1:6]
linear_view_result = F.linear(linear_view, linear_weight, linear_bias_view)

empty_linear_input_cpu = torch.empty((2, 0), dtype=torch.float32)
empty_linear_weight_cpu = torch.empty((5, 0), dtype=torch.float32)
empty_linear_bias_cpu = torch.linspace(-0.4, 0.4, 5)
empty_linear_result = F.linear(
    empty_linear_input_cpu.to("webgpu"),
    empty_linear_weight_cpu.to("webgpu"),
    empty_linear_bias_cpu.to("webgpu"),
)
empty_linear_no_bias_result = F.linear(
    empty_linear_input_cpu.to("webgpu"),
    empty_linear_weight_cpu.to("webgpu"),
)

# Contiguous M=1 with N/K tails exercises the GEMV fast path's bounds checks.
# The multi-tile GEMM shape exercises the register-blocked contiguous path;
# nearby strided/tail shapes above continue to cover the generic kernel.
linear_gemv_input_backing_cpu = (
    torch.arange(260, dtype=torch.float32) % 19 - 9
) * 0.01
linear_gemv_weight_backing_cpu = (
    (torch.arange(71 * 259, dtype=torch.float32) % 23 - 11) * 0.002
).reshape(71, 259)
linear_gemv_bias_backing_cpu = (
    torch.arange(72, dtype=torch.float32) % 13 - 6
) * 0.003
linear_gemv_input_cpu = linear_gemv_input_backing_cpu[1:]
linear_gemv_weight_cpu = linear_gemv_weight_backing_cpu[1:]
linear_gemv_bias_cpu = linear_gemv_bias_backing_cpu[1:71]
linear_gemv_result = F.linear(
    linear_gemv_input_backing_cpu.to("webgpu")[1:],
    linear_gemv_weight_backing_cpu.to("webgpu")[1:],
    linear_gemv_bias_backing_cpu.to("webgpu")[1:71],
)
linear_gemm_input_backing_cpu = (
    (torch.arange(33 * 32, dtype=torch.float32) % 29 - 14) * 0.004
).reshape(33, 32)
linear_gemm_weight_backing_cpu = (
    (torch.arange(65 * 32, dtype=torch.float32) % 31 - 15) * 0.001
).reshape(65, 32)
linear_gemm_input_cpu = linear_gemm_input_backing_cpu[1:]
linear_gemm_weight_cpu = linear_gemm_weight_backing_cpu[1:]
linear_gemm_result = F.linear(
    linear_gemm_input_backing_cpu.to("webgpu")[1:],
    linear_gemm_weight_backing_cpu.to("webgpu")[1:],
)

# The packed Q8 path is deliberately decode-only and requires fixed SIMD32
# subgroups. Build its versioned group-128 representation on CPU, then either
# execute it on supported hardware or prove that unsupported adapters fail
# closed instead of silently dequantizing/falling back.
q8_input_cpu = torch.linspace(-0.75, 0.75, 256, dtype=torch.float32)
q8_weight_cpu = (
    (torch.arange(7 * 256, dtype=torch.float32) % 61) - 30
).reshape(7, 256) * 0.001
q8_bias_cpu = torch.linspace(-0.02, 0.02, 7, dtype=torch.float32)
q8_grouped = q8_weight_cpu.reshape(7, 2, 128)
q8_scales_cpu = q8_grouped.abs().amax(dim=-1)
q8_safe_scales = torch.where(
    q8_scales_cpu == 0,
    torch.ones_like(q8_scales_cpu),
    q8_scales_cpu,
)
q8_values = torch.round(
    q8_grouped * (127.0 / q8_safe_scales.unsqueeze(-1))
).clamp(-127, 127).to(torch.int32)
q8_bytes = q8_values & 0xFF
q8_packed_cpu = (
    q8_bytes[..., 0::4]
    | (q8_bytes[..., 1::4] << 8)
    | (q8_bytes[..., 2::4] << 16)
    | (q8_bytes[..., 3::4] << 24)
).reshape(7, 64).contiguous()
q8_dequantized_weight_cpu = (
    q8_values.to(torch.float32) / 127.0 * q8_scales_cpu.unsqueeze(-1)
).reshape(7, 256)
q8_input = q8_input_cpu.to("webgpu")
q8_packed = q8_packed_cpu.to("webgpu")
q8_scales = q8_scales_cpu.to("webgpu")
q8_bias = q8_bias_cpu.to("webgpu")
q8_supported = bool(
    js.webgpuTest.adapter.subgroups
    and js.webgpuTest.adapter.subgroupMinSize == 32
    and js.webgpuTest.adapter.subgroupMaxSize == 32
)
q8_result = None
if q8_supported:
    q8_result = torch.ops.webgpu.q8_linear(
        q8_input, q8_packed, q8_scales, q8_bias, 128, 1
    )
else:
    try:
        torch.ops.webgpu.q8_linear(
            q8_input, q8_packed, q8_scales, q8_bias, 128, 1
        )
    except RuntimeError as error:
        assert "fixed-size-32 WebGPU subgroup" in str(error)
    else:
        raise AssertionError("Q8 linear unexpectedly ran without SIMD32 subgroups")

# Project-owned decoder-inference kernels accept native int32 indices and the
# signed-int32-valued subset of real 8-byte torch.int64 storage.
token_ids_cpu = torch.tensor([[0, 2, 4], [1, 3, 5]], dtype=torch.int32)
long_token_ids_cpu = token_ids_cpu.long()
embedding_weight_cpu = torch.arange(48, dtype=torch.float32).reshape(6, 8) / 10
token_ids = token_ids_cpu.to("webgpu")
long_token_ids = long_token_ids_cpu.to("webgpu")
embedding_weight = embedding_weight_cpu.to("webgpu")
embedding_result = F.embedding(token_ids, embedding_weight)
long_embedding_result = F.embedding(long_token_ids, embedding_weight)
token_ids_roundtrip = await torch.webgpu.to_cpu_async(token_ids)
long_token_ids_roundtrip = await torch.webgpu.to_cpu_async(long_token_ids)

long_arange = torch.arange(-7, 8, 3, device="webgpu")
long_reverse_arange = torch.arange(7, -8, -3, device="webgpu")
int_arange = torch.arange(2, 11, 2, dtype=torch.int32, device="webgpu")
long_full = torch.full((2, 3), -17, dtype=torch.long, device="webgpu")
long_ones = long_token_ids.new_ones((2, 2))
long_noncontiguous = long_token_ids.t()
long_contiguous = long_noncontiguous.contiguous()
long_cat = torch.cat((long_contiguous, long_contiguous), dim=1)
generation_long_cpu = torch.tensor(
    [[0, 1, 1, 2], [-3, 0, 4, 4]], dtype=torch.long
)
generation_long = generation_long_cpu.to("webgpu")
generation_cumsum = torch.cumsum(generation_long, dim=-1)
generation_test_backing_cpu = torch.tensor(
    [99, -3, 98, 4], dtype=torch.long
)
generation_test_cpu = generation_test_backing_cpu[1::2]
generation_test = generation_test_backing_cpu.to("webgpu")[1::2]
generation_elements = generation_long[:, ::2]
generation_isin = torch.isin(generation_elements, generation_test)
generation_isin_inverted = torch.isin(
    generation_elements,
    generation_test,
    invert=True,
)
generation_negative = generation_long < 0
generation_any_negative = torch.any(generation_negative)
generation_not_negative = torch.bitwise_not(generation_negative)
generation_not_any_negative = torch.bitwise_not(generation_any_negative)
generation_bool_product = generation_negative * generation_not_negative
generation_bool_scalar_product = (
    generation_any_negative * generation_not_any_negative
)
generation_bool_broadcast_product = (
    generation_negative[:, :1] * generation_not_negative
)
generation_pad_token = torch.tensor(0, dtype=torch.long).to("webgpu")
generation_not_padding = generation_long.ne(generation_pad_token)
# Transformers 4.46.3 performs this exact chained conversion when it builds
# the decoder attention mask from input_ids and a tensor pad_token_id.
generation_attention_mask = generation_long.ne(generation_pad_token).long()
generation_strided_bool_long = generation_negative[1:, 1::2].long()
generation_scalar_bool_long = generation_any_negative.long()
generation_expanded_bool_long = generation_any_negative.expand(2, 3).long()
generation_empty_bool_long = generation_negative[:, :0].long()
assert generation_attention_mask.dtype is torch.int64
assert generation_attention_mask.is_contiguous()
assert generation_strided_bool_long.is_contiguous()
assert torch.ops.webgpu.buffer_nbytes(generation_attention_mask) == (
    generation_attention_mask.numel() * 8
)
generation_int_cpu = generation_long_cpu.to(torch.int32)
generation_int = generation_int_cpu.to("webgpu")
generation_int_not_padding = generation_int.ne(generation_pad_token)
generation_ne_broadcast = generation_elements.ne(generation_test)
cache_states_cpu = torch.arange(24, dtype=torch.float32).reshape(1, 2, 3, 4)
dynamic_cache_append = torch.cat(
    (
        torch.tensor([], dtype=torch.float32, device="webgpu"),
        cache_states_cpu.to("webgpu"),
    ),
    dim=-2,
)

# A paired indexed cache write replaces four DynamicCache copy dispatches.
# Cover two updates, both position dtypes, and valid-prefix storage contents.
kv_key_cache = torch.zeros((1, 2, 5, 4), device="webgpu")
kv_value_cache = torch.zeros((1, 2, 5, 4), device="webgpu")
kv_key_states_cpu = torch.arange(16, dtype=torch.float32).reshape(1, 2, 2, 4)
kv_value_states_cpu = -kv_key_states_cpu - 0.5
kv_positions_cpu = torch.tensor([1, 3], dtype=torch.int32)
torch.ops.webgpu.update_kv_cache_(
    kv_key_cache,
    kv_value_cache,
    kv_key_states_cpu.to("webgpu"),
    kv_value_states_cpu.to("webgpu"),
    kv_positions_cpu.to("webgpu"),
)
kv_tail_key_cpu = torch.full((1, 2, 1, 4), 17.0)
kv_tail_value_cpu = torch.full((1, 2, 1, 4), -19.0)
torch.ops.webgpu.update_kv_cache_(
    kv_key_cache,
    kv_value_cache,
    kv_tail_key_cpu.to("webgpu"),
    kv_tail_value_cpu.to("webgpu"),
    torch.tensor([4], dtype=torch.long).to("webgpu"),
)
kv_key_reference = torch.zeros((1, 2, 5, 4))
kv_value_reference = torch.zeros((1, 2, 5, 4))
kv_key_reference[:, :, kv_positions_cpu.long(), :] = kv_key_states_cpu
kv_value_reference[:, :, kv_positions_cpu.long(), :] = kv_value_states_cpu
kv_key_reference[:, :, 4:5, :] = kv_tail_key_cpu
kv_value_reference[:, :, 4:5, :] = kv_tail_value_cpu

# Greedy decoding reduces float32 vocabulary logits over their last
# dimension. Exercise a storage-offset/non-unit-stride view, a reduction tail
# beyond one workgroup, first-index tie breaking, ATen's NaN precedence,
# keepdim, and direct consumption of the canonical Long result by embedding.
argmax_backing_cpu = (
    (torch.arange(5 * 523, dtype=torch.float32) % 97) - 48
).reshape(5, 523)
argmax_input_cpu = argmax_backing_cpu[1:, 2:520:2]
argmax_input_cpu[0, 3] = 1000.0
argmax_input_cpu[0, 257] = 1000.0
argmax_input_cpu[1, 5] = float("nan")
argmax_input_cpu[1, 17] = float("nan")
argmax_input_cpu[2, 2] = 2000.0
argmax_input_cpu[3].fill_(-4.0)
argmax_input = argmax_backing_cpu.to("webgpu")[1:, 2:520:2]
argmax_result = torch.argmax(argmax_input, dim=-1)
argmax_keepdim_result = torch.argmax(argmax_input, dim=1, keepdim=True)
argmax_embedding_result = F.embedding(argmax_result, embedding_weight)
assert argmax_result.dtype is torch.int64
try:
    torch.argmax(argmax_input, dim=0)
except RuntimeError as error:
    assert "only the last dimension" in str(error)
else:
    raise AssertionError("non-last WebGPU argmax unexpectedly succeeded")
try:
    torch.argmax(argmax_input)
except RuntimeError as error:
    assert "explicit last-dimension" in str(error)
else:
    raise AssertionError("dimensionless WebGPU argmax unexpectedly succeeded")

try:
    torch.tensor([2**31], dtype=torch.long).to("webgpu")
except RuntimeError as error:
    assert "signed-int32 values" in str(error)
else:
    raise AssertionError("out-of-profile torch.int64 upload unexpectedly succeeded")

noncontiguous = torch.arange(12, dtype=torch.float32).reshape(3, 4).to("webgpu").t()
contiguous_result = noncontiguous.contiguous()
cat_result = torch.cat((contiguous_result, contiguous_result), dim=1)

bmm_lhs_cpu = torch.arange(24, dtype=torch.float32).reshape(2, 3, 4) / 7
bmm_rhs_cpu = torch.arange(40, dtype=torch.float32).reshape(2, 4, 5) / 11
bmm_result = torch.bmm(bmm_lhs_cpu.to("webgpu"), bmm_rhs_cpu.to("webgpu"))
matmul_result = torch.matmul(
    bmm_lhs_cpu.to("webgpu"), bmm_rhs_cpu.to("webgpu")
)

norm_input_cpu = torch.linspace(-2.0, 2.0, 32).reshape(2, 4, 4)
norm_weight_cpu = torch.linspace(0.5, 1.5, 4)
norm_bias_cpu = torch.linspace(-0.2, 0.2, 4)
layer_norm_result = F.layer_norm(
    norm_input_cpu.to("webgpu"),
    (4,),
    norm_weight_cpu.to("webgpu"),
    norm_bias_cpu.to("webgpu"),
    1e-5,
)
rms_norm_result = F.rms_norm(
    norm_input_cpu.to("webgpu"),
    (4,),

# A complete tiny pre-norm GPT decoder block: token/position embedding,
# QKV/projection linears, fused causal attention, GELU MLP, residuals,
# normalizations, and logits. This is the executable inference acceptance test,
# not merely a set of isolated operator checks.
BATCH, SEQUENCE, WIDTH, HEADS, FF_WIDTH, VOCAB = 1, 8, 16, 4, 32, 24
HEAD_DIM = WIDTH // HEADS
decoder_ids_cpu = torch.tensor([[1, 5, 2, 7, 3, 6, 4, 8]], dtype=torch.int32)
position_ids_cpu = torch.arange(SEQUENCE, dtype=torch.int32).reshape(1, -1)

def deterministic_parameter(shape, scale, shift=0.0):
    count = math.prod(shape)
    return ((torch.arange(count, dtype=torch.float32) % 29) - 14).reshape(shape) * scale + shift

decoder_cpu_parameters = {
    "token": deterministic_parameter((VOCAB, WIDTH), 0.015),
    "position": deterministic_parameter((SEQUENCE, WIDTH), 0.01),
    "ln1_weight": deterministic_parameter((WIDTH,), 0.01, 1.0),
    "ln1_bias": deterministic_parameter((WIDTH,), 0.002),
    "qkv_weight": deterministic_parameter((3 * WIDTH, WIDTH), 0.003),
    "qkv_bias": deterministic_parameter((3 * WIDTH,), 0.001),
    "projection_weight": deterministic_parameter((WIDTH, WIDTH), 0.004),
    "projection_bias": deterministic_parameter((WIDTH,), 0.001),
    "ln2_weight": deterministic_parameter((WIDTH,), 0.01, 1.0),
    "ln2_bias": deterministic_parameter((WIDTH,), 0.002),
    "up_weight": deterministic_parameter((FF_WIDTH, WIDTH), 0.003),
    "up_bias": deterministic_parameter((FF_WIDTH,), 0.001),
    "down_weight": deterministic_parameter((WIDTH, FF_WIDTH), 0.003),
    "down_bias": deterministic_parameter((WIDTH,), 0.001),
    "final_weight": deterministic_parameter((VOCAB, WIDTH), 0.004),
    "final_bias": deterministic_parameter((VOCAB,), 0.001),
}

def decoder_block(ids, positions, parameters):
    hidden = F.embedding(ids, parameters["token"]) + F.embedding(positions, parameters["position"])
    normalized = F.layer_norm(
        hidden, (WIDTH,), parameters["ln1_weight"], parameters["ln1_bias"], 1e-5
    )
    qkv = F.linear(normalized, parameters["qkv_weight"], parameters["qkv_bias"])
    qkv = qkv.view(BATCH, SEQUENCE, 3, HEADS, HEAD_DIM)
    query = qkv.select(2, 0).permute(0, 2, 1, 3)
    key = qkv.select(2, 1).permute(0, 2, 1, 3)
    value = qkv.select(2, 2).permute(0, 2, 1, 3)
    attended = F.scaled_dot_product_attention(
        query, key, value, dropout_p=0.0, is_causal=True
    )
    attended = attended.permute(0, 2, 1, 3).contiguous().view(BATCH, SEQUENCE, WIDTH)
    hidden = hidden + F.linear(
        attended, parameters["projection_weight"], parameters["projection_bias"]
    )
    normalized = F.layer_norm(
        hidden, (WIDTH,), parameters["ln2_weight"], parameters["ln2_bias"], 1e-5
    )
    mlp = F.linear(normalized, parameters["up_weight"], parameters["up_bias"])
    mlp = F.gelu(mlp)
    hidden = hidden + F.linear(mlp, parameters["down_weight"], parameters["down_bias"])
    return F.linear(hidden, parameters["final_weight"], parameters["final_bias"])

with torch.no_grad():
    decoder_reference = decoder_block(
        decoder_ids_cpu, position_ids_cpu, decoder_cpu_parameters
    )
    decoder_gpu_parameters = {
        name: value.to("webgpu") for name, value in decoder_cpu_parameters.items()
    }
    decoder_ids = decoder_ids_cpu.to("webgpu")
    decoder_positions = position_ids_cpu.to("webgpu")
    decoder_diagnostics_before = torch.webgpu.diagnostics()
    with torch.webgpu.batch():
        with torch.webgpu.batch():
            decoder_logits = decoder_block(
                decoder_ids, decoder_positions, decoder_gpu_parameters
            )
        decoder_diagnostics_nested_exit = torch.webgpu.diagnostics()
        assert decoder_diagnostics_nested_exit["batch_depth"] == 1
        assert decoder_diagnostics_nested_exit["pending_command_buffers"] == 15
        assert (
            decoder_diagnostics_nested_exit["command_submissions"]
            == decoder_diagnostics_before["command_submissions"]
        )
    decoder_diagnostics_after = torch.webgpu.diagnostics()
    decoder_dispatches = (
        decoder_diagnostics_after["dispatches"]
        - decoder_diagnostics_before["dispatches"]
    )
    decoder_buffer_allocations = (
        decoder_diagnostics_after["buffer_allocations"]
        - decoder_diagnostics_before["buffer_allocations"]
    )
    # Every dispatch creates one transient uniform buffer; the remainder are
    # tensor storage allocations. Track both so a kernel fusion cannot look
    # like a tensor-allocation regression.
    decoder_tensor_allocations = decoder_buffer_allocations - decoder_dispatches
    decoder_command_submissions = (
        decoder_diagnostics_after["command_submissions"]
        - decoder_diagnostics_before["command_submissions"]
    )
    decoder_command_buffers = (
        decoder_diagnostics_after["command_buffers_submitted"]
        - decoder_diagnostics_before["command_buffers_submitted"]
    )
    assert decoder_dispatches == 15, decoder_dispatches
    assert decoder_command_submissions == 1, decoder_command_submissions
    assert decoder_command_buffers == 15, decoder_command_buffers
    assert decoder_diagnostics_after["pending_command_buffers"] == 0
    assert decoder_diagnostics_after["batch_depth"] == 0

# Timing is diagnostic only. CI uses SwiftShader, so these measurements detect
# pathological regressions but do not represent hardware WebGPU performance.
PERFORMANCE_REPEATS = 5

def gpu_decoder_forward():
    # One model forward is the natural submission boundary. Kernel command
    # buffers remain ordered, while queue submission crosses JS only once.
    with torch.webgpu.batch():
        return decoder_block(decoder_ids, decoder_positions, decoder_gpu_parameters)

with torch.no_grad():
    gpu_decoder_forward()
    torch.webgpu.synchronize()
    gpu_start = time.perf_counter()
    for _ in range(PERFORMANCE_REPEATS):
        gpu_decoder_forward()
    torch.webgpu.synchronize()
    gpu_milliseconds = (time.perf_counter() - gpu_start) * 1000 / PERFORMANCE_REPEATS

    cpu_start = time.perf_counter()
    for _ in range(PERFORMANCE_REPEATS):
        decoder_block(decoder_ids_cpu, position_ids_cpu, decoder_cpu_parameters)
    cpu_milliseconds = (time.perf_counter() - cpu_start) * 1000 / PERFORMANCE_REPEATS
